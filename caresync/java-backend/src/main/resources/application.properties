# CareSync Spring Boot Configuration
server.port=8080
spring.application.name=caresync-backend

# MySQL DataSource Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/caresyncjava?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=tiger
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate ORM & JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# Logging configuration
logging.level.org.hibernate.SQL=DEBUG
logging.level.com.caresync=INFO
